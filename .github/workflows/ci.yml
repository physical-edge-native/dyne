name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: simulator regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/heat1d-actor
            crates/heat1d-pinn-actor
            crates/heat2d-actor
            crates/sdf2d-grid-actor
            crates/imu-fusion-actor
            crates/wave2d-actor
            crates/mlp-core
            crates/mlp-actor
            crates/mlp-train-actor
            examples/decay1d-actor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy matplotlib onnx onnxruntime wasmtime
      - run: bash scripts/ci-check.sh
        env:
          REQUIRE_NUMPY: "1"
          REQUIRE_ONNX: "1"
