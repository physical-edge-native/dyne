[package]
name = "decay1d-actor"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/physical-edge-native/dyne"
description = "Tutorial WebAssembly actor: 1D heat conduction with linear decay (docs/en/tutorial.md)"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
panic = "abort"
opt-level = "z"
lto = true

