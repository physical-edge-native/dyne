[package]
name = "wave2d-actor"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/physical-edge-native/dyne"
description = "WebAssembly actor: 2D wave equation (leapfrog) on a rectangular block"

[lib]
# cdylib = WASMアクター本体 / rlib = ネイティブの検証 (examples/wave_study.rs) 用
crate-type = ["cdylib", "rlib"]

[features]
# 実機用の縮小版 (線形メモリ1ページ=64KB に収める。区画は1辺48点まで)
small = []

[dependencies]
# 純Rustの数学関数 (初期条件の sin/cos/exp)。プラットフォーム非依存で決定論を保つ
libm = "0.2"
# ワイヤ形式v2の単一定義 (受信箱・送信箱のメッセージはこの規約のみ)
dyne-wire = { path = "../dyne-wire" }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true

[workspace]
