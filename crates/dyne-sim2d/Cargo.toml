[package]
name = "dyne-sim2d"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/physical-edge-native/dyne"
description = "Deterministic 2D multi-node simulator with packet loss, latency, pauses and partitions"

[dependencies]
wasmi = "0.47"
dyne-core = { path = "../dyne-core" }
dyne-wire = { path = "../dyne-wire" }
# Writes the final field as a VTK ImageData file (`--vti`).
dyne-export = { path = "../dyne-export" }
# 解析解の exp/sin を純Rustで計算する (OS間で出力をビット一致させるため)
libm = "0.2"
