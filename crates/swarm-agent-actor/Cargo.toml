[package]
name = "swarm-agent-actor"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/physical-edge-native/dyne"
description = "WebAssembly actor: one agent of the swarm demo (first mailbox-style actor)"

[lib]
# cdylib = WASMアクター本体 / rlib = ネイティブの単体テスト用 (heat1d-pinn-actor と同方針)
crate-type = ["cdylib", "rlib"]

[dependencies]
# 純Rustの数学関数 (sqrt/log/sin/cos/fabs)。プラットフォーム非依存で決定論を保つ
libm = "0.2"
# ワイヤ形式v2の単一定義 (受信箱・送信箱のメッセージはこの規約のみ)
dyne-wire = { path = "../dyne-wire" }

[dev-dependencies]
# ネイティブテストで内蔵乱数がホスト側 (dyne-core) の規約と一致することを照合する
dyne-core = { path = "../dyne-core" }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true

[workspace]
