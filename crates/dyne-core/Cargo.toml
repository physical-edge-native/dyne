[package]
name = "dyne-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/physical-edge-native/dyne"
description = "Shared simulator parts: deterministic RNG, discrete-event virtual time, virtual network, WebAssembly actor loading"

[dependencies]
wasmi = "0.47"
dyne-wire = { path = "../dyne-wire" }
# 純Rustの数学関数 (exp/log/sqrt)。透過境界の係数計算をプラットフォーム非依存
# (OS間ビット一致) に保つため、std の libm 依存関数は使わない
libm = "0.2"
