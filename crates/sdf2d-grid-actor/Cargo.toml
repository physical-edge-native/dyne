[package]
name = "sdf2d-grid-actor"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/physical-edge-native/dyne"
description = "WebAssembly actor: builds a 2D signed distance field of a room from range measurements"

[lib]
# cdylib = WASMアクター本体 / rlib = ネイティブの単体テスト用 (swarm-agent-actor と同方針)
crate-type = ["cdylib", "rlib"]

[features]
# 実機用の縮小版 (線形メモリ1ページ=64KB に収める。区画は 1辺40点・枠なし1100点まで、
# 光線は1ステップ64本まで。docs/2026-11-11-esp32-interp-bench.md)
small = []
std-math = []
f32 = []

[dependencies]
# 純Rustの数学関数 (sqrt・sin・cos・floor)。プラットフォーム非依存で決定論を保つ
libm = "0.2"
# ワイヤ形式v2の単一定義 (受信箱・送信箱のメッセージはこの規約のみ)
dyne-wire = { path = "../dyne-wire" }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true

[workspace]
