[package]
name = "heat1d-actor"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/physical-edge-native/dyne"
description = "WebAssembly actor: 1D heat conduction (full and small builds)"

[lib]
crate-type = ["cdylib"]

[features]
# 実機ESPr32 (PSRAMなし) 向けの縮小版: N_MAX=2048 で線形メモリを1ページ=64KBに
# 収める (発注7 実機不具合対応(b)、2026-09-18)。ビルドは scripts/build-actor-wasm.ps1
# (スタック8KBのRUSTFLAGSと成果物名 heat1d_actor_small.wasm への複製を含む)
small = []

[profile.release]
panic = "abort"
opt-level = "z"
lto = true

[workspace]
