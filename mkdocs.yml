site_name: Dyne documentation
site_url: https://physical-edge-native.github.io/dyne/
site_description: Run physics models on a swarm of microcontrollers, keep a digital twin of a real space on them, and hand it to other tools.
repo_url: https://github.com/physical-edge-native/dyne
repo_name: physical-edge-native/dyne
edit_uri: edit/main/docs-site/
docs_dir: docs-site
copyright: Dyne contributors, MIT OR Apache-2.0
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
  - pymdownx.details
extra:
  social:
    - icon: material/forum
      link: https://github.com/physical-edge-native/dyne/discussions
      name: Questions and ideas (GitHub Discussions)
hooks:
  - scripts/mkdocs_hooks.py
nav:
  - Home: index.md
  - Getting started:
      - Quick start: getting-started.md
      - Installation: guide/installation.md
  - How it works: concepts.md
  - Tutorials:
      - A room from simulated sensors to USD and OpenFOAM: guide/tutorial-room.md
      - A real room, end to end: tutorials/real-room.md
      - The 2D wave equation: tutorials/wave-equation.md
      - Write your own solver: guide/tutorial.md
  - Hardware:
      - Overview: hardware.md
      - Hardware guide: guide/hardware.md
      - "Result: IMU fusion (2026-11-21)": results/imu-2026-11-21.md
      - "Result: how the room twin grows (simulator)": results/twin-growth.md
  - Connecting to other tools: connect.md
  - Verification: verification.md
  - Theory: theory.md
  - Status and limits: status.md
  - Reference:
      - Solver interface and messages: guide/reference.md
      - Components: components.md
  - Contributing: contributing.md
